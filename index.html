<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Completion Save Flow – Swipe Guide</title>
  <style>
    :root{
      --pad: 18px;
      --radius: 22px;
      --bg: #07121f;
      --card: #ffffff;
      --text: #0b1220;
      --muted: #334155;
      --o2blue: #005EB8;
      --virginRed: #E4002B;
      --stroke: #d6dde8;
      --shadow: rgba(0,0,0,.28);
    }
    *{ box-sizing: border-box; }
    body{
      margin:0;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
      background:
        radial-gradient(1200px 600px at 15% 0%, rgba(0,94,184,.22), transparent 60%),
        radial-gradient(900px 500px at 90% 20%, rgba(228,0,43,.18), transparent 55%),
        var(--bg);
      color:#e9eef5;
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 22px;
    }
    .wrap{ width: min(920px, 100%); padding: var(--pad); }
    .card{
      width: 100%;
      max-width: 920px;
      margin: 0 auto;
      background: var(--card);
      border: 1px solid var(--stroke);
      border-radius: var(--radius);
      padding: 26px;
      box-shadow: 0 18px 55px var(--shadow);
      user-select:none;
      touch-action: pan-y;
    }
    .top{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap: 16px;
      flex-wrap: wrap;
    }
    .brand{
      display:flex;
      gap: 14px;
      align-items:center;
      min-width: 280px;
    }
    .logo{
      width: 58px;
      height: 58px;
      border-radius: 16px;
      border: 2px dashed rgba(0,94,184,.5);
      background: #fff;
      object-fit: contain;
    }
    .brandName{
      color: var(--text);
      font-weight: 950;
      letter-spacing: .2px;
      font-size: 18px;
      line-height: 1.1;
    }
    .brandSub{
      color: var(--muted);
      font-size: 14px;
      margin-top: 4px;
      font-weight: 750;
    }
    .rightTop{
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
    }
    .badge{
      font-size: 14px;
      color: var(--text);
      padding: 10px 12px;
      border: 1px solid var(--stroke);
      border-radius: 999px;
      background: #f5f7fb;
      font-weight: 850;
    }
    .pill{
      display:inline-block;
      padding: 10px 12px;
      border-radius: 999px;
      border: 1px solid var(--stroke);
      background: #f5f7fb;
      font-size: 14px;
      color: var(--text);
      font-weight: 750;
    }
    .pill.note{
      background: rgba(0,94,184,.08);
      border-color: rgba(0,94,184,.35);
    }
    .title{
      font-size: 30px;
      font-weight: 950;
      line-height: 1.15;
      margin: 18px 0 10px;
      color: #0b1220;
    }
    .desc{
      font-size: 20px;
      line-height: 1.45;
      color: #0b1220;
      margin: 0;
      white-space: pre-line;
    }
    .actions{
      display:flex;
      gap: 14px;
      margin-top: 22px;
      flex-wrap: wrap;
    }
    button{
      border: 0;
      padding: 18px 18px;
      border-radius: 18px;
      font-size: 20px;
      cursor: pointer;
      flex: 1 1 240px;
      font-weight: 950;
      box-shadow: 0 10px 20px rgba(0,0,0,.10);
    }
    button.yes{ background: var(--o2blue); color: #fff; }
    button.no{ background: var(--virginRed); color: #fff; }
    button.primary{ background: var(--o2blue); color: #fff; }
    button.secondary{
      background: #eef2ff;
      color: #0b1220;
      border: 1px solid #d6dde8;
      box-shadow: none;
      font-weight: 900;
    }
    .hint{
      margin-top: 14px;
      font-size: 16px;
      color: #334155;
      font-weight: 650;
    }
    .footer{
      margin-top: 14px;
      display:flex;
      justify-content:space-between;
      gap:10px;
      flex-wrap:wrap;
      align-items:center;
      font-size: 13px;
      color: #334155;
      font-weight: 750;
    }
    .link{
      color: var(--o2blue);
      text-decoration:none;
      font-weight: 950;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" id="card" aria-live="polite">
      <div class="top">
        <div class="brand">
          <img class="logo" src="virginmediao2logo.png" alt="Virgin Media O2" />
          <div>
            <div class="brandName">Virgin Media O2</div>
            <div class="brandSub">Completion Save Flow – Swipe Guide</div>
          </div>
        </div>
        <div class="rightTop">
          <div class="badge" id="badge">Step 1</div>
          <div class="pill note" id="pill">Swipe right = Yes • Swipe left = No</div>
        </div>
      </div>

      <div class="title" id="title"></div>
      <p class="desc" id="desc"></p>

      <div class="actions" id="actions"></div>

      <div class="hint" id="hint">Tip: buttons work too</div>
      <div class="footer">
        <a class="link" href="#" id="reset">Reset</a>
      </div>
    </div>
  </div>

  <script>
    const STEPS = {
      start: {
        type: "question",
        title: "Job at risk of failing?",
        desc: "Use this flow to try to save the job wherever possible.\nIf a save isn’t possible, it will guide the correct closure and next action.",
        yes: "reason_customerNotReady",
        no: "done_continue"
      },

      done_continue: {
        type: "result",
        title: "Continue with install",
        desc: "Proceed as normal."
      },

      reason_customerNotReady: {
        type: "question",
        title: "Customer / property not ready?",
        desc: "",
        yes: "cnr_returnLater",
        no: "reason_customerUnsure"
      },

      cnr_returnLater: {
        type: "question",
        title: "Can you return later today?",
        desc: "If the customer confirms a later re-attend time, return and complete.",
        yes: "cnr_returnLater_action",
        no: "cnr_tempEquip"
      },

      cnr_returnLater_action: {
        type: "result",
        title: "Re-attend later and complete",
        desc: "Arrange the time with the customer and continue when they’re ready."
      },

      cnr_tempEquip: {
        type: "question",
        title: "Can you install equipment safely as a temporary position today?",
        desc: "Only if safe and hazard-free. Agree a return plan with the customer where needed.",
        yes: "cnr_tempEquip_action",
        no: "cnr_reschedule"
      },

      cnr_tempEquip_action: {
        type: "result",
        title: "Complete install with safe temporary placement",
        desc: "Ensure no hazards. Agree next steps with customer if equipment needs moving later."
      },

      cnr_reschedule: {
        type: "result",
        title: "Reschedule",
        desc: "Inform routing/FM to arrange a new date."
      },

      reason_customerUnsure: {
        type: "question",
        title: "Customer unsure / second thoughts / route not agreed?",
        desc: "",
        yes: "cus_resolveConcerns",
        no: "reason_noOneHome"
      },

      cus_resolveConcerns: {
        type: "question",
        title: "Can you resolve the concerns on-site?",
        desc: "Explore alternatives and align with customer expectations where possible.",
        yes: "done_continue",
        no: "cus_escalateFM"
      },

      cus_escalateFM: {
        type: "question",
        title: "Can FM or a senior technician help resolve concerns today?",
        desc: "Escalate with clear detail of what the customer expected vs what is possible.",
        yes: "done_continue",
        no: "cus_reschedule"
      },

      cus_reschedule: {
        type: "result",
        title: "Reschedule",
        desc: "If concerns can’t be resolved, arrange reschedule via routing/FM."
      },

      reason_noOneHome: {
        type: "question",
        title: "No reply / no one home?",
        desc: "",
        yes: "noh_contact",
        no: "reason_dropRepull"
      },

      noh_contact: {
        type: "info",
        title: "Contact attempt",
        desc: "Call all numbers available.\nText the customer.\nLeave voicemail where possible.\nIf number is incorrect, contact FM to find alternate contact details (FM may be able to email the customer).",
        next: "noh_wait"
      },

      noh_wait: {
        type: "question",
        title: "Can you move on and re-attend later today?",
        desc: "AM jobs: move on sooner and re-attend later.\nPM jobs: allow a reasonable wait.\nIf the customer confirms re-attend time, return and complete.",
        yes: "noh_reattend_action",
        no: "noh_reschedule"
      },

      noh_reattend_action: {
        type: "result",
        title: "Re-attend later and complete",
        desc: "If the customer confirms availability later, return and complete."
      },

      noh_reschedule: {
        type: "result",
        title: "Reschedule",
        desc: "If no contact and no confirmed re-attend, arrange reschedule via routing/FM."
      },

      reason_dropRepull: {
        type: "question",
        title: "Drop / repull required (or damaged/low levels/SNR)?",
        desc: "",
        yes: "dr_cableType",
        no: "reason_noAccessPitCab"
      },

      dr_cableType: {
        type: "question",
        title: "Is this COAX?",
        desc: "COAX and Fibre saves differ.",
        yes: "coax_visualDamage",
        no: "fiber_lightChecks"
      },

      coax_visualDamage: {
        type: "question",
        title: "Is there visible damage or a clear bad section to remove?",
        desc: "Cut back to remove damaged section, test at the cut point.",
        yes: "coax_cutAndTest_action",
        no: "coax_boundaryTest"
      },

      coax_cutAndTest_action: {
        type: "info",
        title: "Cut back & test",
        desc: "Cut at the damaged point and test.\nIf levels OK, splice and run new cable from that point.\nBury cable and reinstate the garden safely.",
        next: "coax_fixedAfterCut"
      },

      coax_fixedAfterCut: {
        type: "question",
        title: "Fixed after cutting back and splicing?",
        desc: "",
        yes: "done_continue",
        no: "coax_boundaryTest"
      },

      coax_boundaryTest: {
        type: "info",
        title: "Boundary test",
        desc: "Cut at boundary wall and test.\nIf OK, splice and run new cable.\nReinstate safely.",
        next: "coax_fixedAfterBoundary"
      },

      coax_fixedAfterBoundary: {
        type: "question",
        title: "Fixed from boundary cut/test?",
        desc: "",
        yes: "done_continue",
        no: "coax_neighbourTemp"
      },

      coax_neighbourTemp: {
        type: "question",
        title: "Temporary connection from neighbour possible and appropriate?",
        desc: "Only if it’s a valid option and safe to do so.",
        yes: "coax_temp_action",
        no: "coax_sameDayRepull"
      },

      coax_temp_action: {
        type: "result",
        title: "Complete using temporary connection",
        desc: "Complete install and arrange the permanent fix through the correct channel."
      },

      coax_sameDayRepull: {
        type: "question",
        title: "Can FM arrange repull today?",
        desc: "",
        yes: "coax_repullToday_action",
        no: "coax_constructionNeeded"
      },

      coax_repullToday_action: {
        type: "result",
        title: "Proceed with repull today",
        desc: "Coordinate with FM and complete."
      },

      coax_constructionNeeded: {
        type: "question",
        title: "Is construction required for repull?",
        desc: "If construction is required, do not complete a dry install.",
        yes: "coax_closeNotDone",
        no: "coax_dryInstall_tlos"
      },

      coax_dryInstall_tlos: {
        type: "result",
        title: "Complete dry install and book TLOS repull (next working day)",
        desc: "Only if no construction is required and it’s appropriate to do so."
      },

      coax_closeNotDone: {
        type: "result",
        title: "Close as not done",
        desc: "Inform customer. Book TLOS with construction required. Do not dry install."
      },

      fiber_lightChecks: {
        type: "info",
        title: "Fibre checks",
        desc: "Clean and scope fibre ends.\nCheck light levels with meter.\nIf qualified and accessible, confirm light at port.\nIf no light from port, use a new port.",
        next: "fiber_inSpec"
      },

      fiber_inSpec: {
        type: "question",
        title: "Light levels now within spec?",
        desc: "",
        yes: "done_continue",
        no: "fiber_sameDayPreblow"
      },

      fiber_sameDayPreblow: {
        type: "question",
        title: "Can FM arrange preblow/prework today?",
        desc: "",
        yes: "fiber_preblow_action",
        no: "fiber_constructionNeeded"
      },

      fiber_preblow_action: {
        type: "result",
        title: "Proceed with prework today",
        desc: "Coordinate via FM and complete the install."
      },

      fiber_constructionNeeded: {
        type: "question",
        title: "Are there construction issues?",
        desc: "If construction is required, do not complete a dry install.",
        yes: "fiber_closeNotDone",
        no: "fiber_dryInstall_tlos"
      },

      fiber_dryInstall_tlos: {
        type: "result",
        title: "Complete dry install and book TLOS",
        desc: "If no construction issues, complete dry install and book TLOS."
      },

      fiber_closeNotDone: {
        type: "result",
        title: "Close as not done",
        desc: "Book TLOS with construction required. Do not dry install."
      },

      reason_noAccessPitCab: {
        type: "question",
        title: "No access to pit/cab (blocked by vehicle)?",
        desc: "",
        yes: "access_findOwner",
        no: "reason_orderEntry"
      },

      access_findOwner: {
        type: "info",
        title: "Try to gain access",
        desc: "Ask around to find the owner.\nRequest the vehicle is moved temporarily.\nIf not possible, leave a polite note requesting it is moved.\nReturn later the same day to re-check access.",
        next: "access_movedLater"
      },

      access_movedLater: {
        type: "question",
        title: "Access available later today?",
        desc: "",
        yes: "done_continue",
        no: "access_reschedule"
      },

      access_reschedule: {
        type: "result",
        title: "Reschedule",
        desc: "If access cannot be gained today, arrange reschedule via routing/FM."
      },

      reason_orderEntry: {
        type: "question",
        title: "Order entry error / package issue?",
        desc: "",
        yes: "order_tryResolve",
        no: "reason_systemDown"
      },

      order_tryResolve: {
        type: "info",
        title: "Attempt same-day resolution",
        desc: "Confirm the order was placed.\nContact Customer Service / local sales support to correct package where possible.\nFor TV/service expectation issues, use the relevant support channels.",
        next: "order_resolved"
      },

      order_resolved: {
        type: "question",
        title: "Resolved and customer happy to proceed today?",
        desc: "",
        yes: "done_continue",
        no: "order_rescheduleOrCancel"
      },

      order_rescheduleOrCancel: {
        type: "result",
        title: "Reschedule or cancel (as requested)",
        desc: "If the package cannot be corrected today, follow the correct customer-request closure route."
      },

      reason_systemDown: {
        type: "question",
        title: "System downtime?",
        desc: "",
        yes: "system_completeLater",
        no: "reason_customerRescheduleCancel"
      },

      system_completeLater: {
        type: "result",
        title: "Complete install and close when systems return",
        desc: "Install completed on the day. Close out once systems are available."
      },

      reason_customerRescheduleCancel: {
        type: "question",
        title: "Customer requested reschedule or cancellation?",
        desc: "",
        yes: "cust_tryKeepToday",
        no: "reason_nonServiceable"
      },

      cust_tryKeepToday: {
        type: "info",
        title: "Try to complete today",
        desc: "Make reasonable accommodations to complete today.\nOffer re-attend later today if they’re unavailable now.\nIf another responsible adult can provide access, proceed.\nIf the customer confirms a later time today, re-attend and complete.",
        next: "cust_stillWantsRescheduleCancel"
      },

      cust_stillWantsRescheduleCancel: {
        type: "question",
        title: "Customer still wants reschedule/cancel after options offered?",
        desc: "",
        yes: "cust_rescheduleCancel_action",
        no: "done_continue"
      },

      cust_rescheduleCancel_action: {
        type: "result",
        title: "Reschedule or cancel (as requested)",
        desc: "Close correctly and ensure the request is recorded through the proper channel."
      },

      reason_nonServiceable: {
        type: "question",
        title: "Non-serviceable / no capacity / facilities?",
        desc: "",
        yes: "ns_checks",
        no: "reason_wayleave"
      },

      ns_checks: {
        type: "info",
        title: "Checks before concluding non-serviceable",
        desc: "Check local records (e.g. Badger) for neighbour installs.\nIf any have service, review their install method and attempt to replicate.\nAsk FM to check network build details.\nRequest senior engineer support if needed.",
        next: "ns_resolved"
      },

      ns_resolved: {
        type: "question",
        title: "A viable method found to complete today?",
        desc: "",
        yes: "done_continue",
        no: "ns_close"
      },

      ns_close: {
        type: "result",
        title: "Close as non-serviceable",
        desc: "Close correctly so the issue routes through the right resolution channel."
      },

      reason_wayleave: {
        type: "question",
        title: "Wayleave / listed building restriction?",
        desc: "",
        yes: "wl_close",
        no: "final_close"
      },

      wl_close: {
        type: "result",
        title: "Close and route via correct approval channel",
        desc: "Record clearly and ensure it is passed to the correct team for action."
      },

      final_close: {
        type: "result",
        title: "Close correctly",
        desc: "If none of the save routes apply, close using the correct reason and ensure it routes through the right channel."
      }
    };

    let path = [];
    let current = "start";

    const badge = document.getElementById("badge");
    const title = document.getElementById("title");
    const desc = document.getElementById("desc");
    const actions = document.getElementById("actions");
    const reset = document.getElementById("reset");
    const card = document.getElementById("card");

    function render() {
      const step = STEPS[current];
      badge.textContent = `Step ${path.length + 1}`;
      title.textContent = step.title;
      desc.textContent = step.desc || "";
      actions.innerHTML = "";

      if (step.type === "question") {
        const btnNo = document.createElement("button");
        btnNo.className = "no";
        btnNo.textContent = "No";
        btnNo.onclick = () => go("no");

        const btnYes = document.createElement("button");
        btnYes.className = "yes";
        btnYes.textContent = "Yes";
        btnYes.onclick = () => go("yes");

        actions.append(btnNo, btnYes);
      } else {
        const btnBack = document.createElement("button");
        btnBack.className = "secondary";
        btnBack.textContent = "Back";
        btnBack.onclick = back;

        const btnNext = document.createElement("button");
        btnNext.className = "primary";
        btnNext.textContent = step.next ? "Next" : "Done";
        btnNext.onclick = () => step.next ? go("next") : null;

        actions.append(btnBack, btnNext);
      }
    }

    function go(answer) {
      const step = STEPS[current];
      path.push(current);

      if (step.type === "question") {
        current = (answer === "yes") ? step.yes : step.no;
      } else {
        current = step.next;
      }

      if (!current) current = path[path.length - 1];
      render();
    }

    function back() {
      if (path.length === 0) return;
      current = path.pop();
      render();
    }

    reset.addEventListener("click", (e) => {
      e.preventDefault();
      path = [];
      current = "start";
      render();
    });

    let x0 = null, y0 = null;

    card.addEventListener("touchstart", (e) => {
      const t = e.changedTouches[0];
      x0 = t.clientX;
      y0 = t.clientY;
    }, {passive:true});

    card.addEventListener("touchend", (e) => {
      if (x0 === null) return;
      const t = e.changedTouches[0];
      const dx = t.clientX - x0;
      const dy = t.clientY - y0;
      x0 = y0 = null;

      if (Math.abs(dy) > Math.abs(dx)) return;
      if (Math.abs(dx) < 60) return;

      const step = STEPS[current];
      if (step.type !== "question") return;

      if (dx > 0) go("yes");
      else go("no");
    }, {passive:true});

    render();
  </script>
</body>
</html>
